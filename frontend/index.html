<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Web</title>
    <meta
      name="description"
      content="WhatsApp Web - End-to-end encrypted messaging, voice and video chat, media sharing, and real-time status updates."
    />

    <!-- Theme & App Branding -->
    <meta name="theme-color" content="#00a884" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhatsApp" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect / DNS Prefetch -->
    <link rel="dns-prefetch" href="https://whatsapp-backend-97f3.onrender.com" />
    <link rel="preconnect" href="https://whatsapp-backend-97f3.onrender.com" crossorigin />

    <!-- Pre-warm Render Backend -->
    <script>
      (function () {
        try {
          var targetUrl = "https://whatsapp-backend-97f3.onrender.com/api/health";
          fetch(targetUrl, { method: "GET", mode: "cors" }).catch(function () {});
        } catch (e) {}
      })();
    </script>

    <!-- Register PWA Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/sw.js", { scope: "/" })
          .then(function (reg) {
            console.log("✅ PWA Service Worker registered:", reg.scope);
          })
          .catch(function (err) {
            console.warn("⚠️ PWA Service Worker registration failed:", err);
          });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
